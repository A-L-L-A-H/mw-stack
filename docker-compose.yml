name: mw-stack

networks:
  mw-net:
    driver: bridge

volumes:
  mw_echo_data:
  mw_lab_data:
  mw_mission_data:
  mw_cp_data:
  mw_postgres_data:
  mw_dock_data:
  mw_design_data:
  mw_board_data:
  mw_isp_data:
  mw_corpus_data:
  mw_nexus_data:
  mw_lore_data:
  mw_rid_data:
  mw_rocksoul_gateway_data:
  mw_rocksoul_sandbox_data:
  mw_caddy_data:
  mw_caddy_config:

services:
  # ---------------------------------------------------------------------------
  # LITE / OPS / FULL — Sovereign Core Node
  # ---------------------------------------------------------------------------
  mw-echo:
    image: ghcr.io/a-l-l-a-h/mw-echo:${MW_IMAGE_TAG:-latest}
    container_name: mw-echo
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["lite", "ops", "business", "full"]
    ports:
      - "${MW_ECHO_PORT:-4310}:4310"
    environment:
      PORT: "4310"
      MW_LAB_URL: "http://mw-lab:4400"
      MW_MISSION_URL: "http://mw-mission:4410"
      MW_DOCK_URL: "http://mw-dock:3000"
      MW_DESIGN_URL: "http://mw-design:8080"
      MW_ISP_URL: "http://mw-isp:8091"
      MW_CP_URL: "http://mw-cp:4440"
      MW_CORPUS_URL: "http://mw-corpus:4420"
      MW_NEXUS_URL: "http://mw-nexus:4430"
      MW_LORE_URL: "http://mw-lore:4450"
      MW_MYLOVE_URL: "http://mw-mylove:4460"
      MW_STUDIO_URL: "http://mw-studio:4470"
      MW_RID_URL: "http://mw-rid:4480"
      MW_ROCKSOUL_GATEWAY_URL: "http://mw-rocksoul-gateway:4510"
      ROCKSOUL_GATEWAY_URL: "http://mw-rocksoul-gateway:4510"
      MW_ROCKSOUL_CORE_URL: "http://mw-rocksoul-core:4520"
      MW_ROCKSOUL_MCP_URL: "http://mw-rocksoul-mcp:4530"
      MW_ROCKSOUL_SANDBOX_URL: "http://mw-rocksoul-sandbox:4540"
      MW_RID_ISSUER: "https://id.${MW_DOMAIN:-mw.local}"
      MW_RID_JWKS_URL: "http://mw-rid:4480/jwks"
      MW_API_SECRET: "${MW_API_SECRET:-}"
      MW_JWT_SECRET: "${MW_JWT_SECRET:-}"
      MW_ENCRYPTION_KEY: "${MW_ENCRYPTION_KEY:-}"
      NTFY_TOPIC_URL: "${NTFY_TOPIC_URL:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    volumes:
      - mw_echo_data:/data
    networks:
      - mw-net

  # ---------------------------------------------------------------------------
  # ID / OPS / SAAS / FULL — Sovereign OIDC Identity Provider (mw-rid)
  # ---------------------------------------------------------------------------
  mw-rid:
    image: ghcr.io/a-l-l-a-h/mw-rid:${MW_IMAGE_TAG:-latest}
    container_name: mw-rid
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["id", "ops", "saas", "business", "full"]
    ports:
      - "${MW_RID_PORT:-4480}:4480"
    environment:
      MW_RID_PORT: "4480"
      MW_RID_HOST: "0.0.0.0"
      MW_RID_ISSUER: "https://id.${MW_DOMAIN:-mw.local}"
      MW_RID_DB_PATH: "/data/rid.sqlite"
      MW_RID_BOOTSTRAP_SECRET: "${RID_BOOTSTRAP_SECRET:-}"
      MW_RID_COOKIE_SECRET: "${MW_JWT_SECRET:-}"
    volumes:
      - mw_rid_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4480/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mw-net

  # ---------------------------------------------------------------------------
  # OPS / FULL — Fleet Operations & Control Plane
  # ---------------------------------------------------------------------------
  mw-lab:
    image: ghcr.io/a-l-l-a-h/mw-lab:${MW_IMAGE_TAG:-latest}
    container_name: mw-lab
    restart: unless-stopped
    profiles: ["ops", "full"]
    ports:
      - "${MW_LAB_PORT:-4400}:4400"
    environment:
      PORT: "4400"
      MW_ECHO_URL: "http://mw-echo:4310"
      MW_MISSION_URL: "http://mw-mission:4410"
      MW_RID_URL: "http://mw-rid:4480"
      MW_RID_ISSUER: "https://id.${MW_DOMAIN:-mw.local}"
      MW_RID_JWKS_URL: "http://mw-rid:4480/jwks"
      MW_API_SECRET: "${MW_API_SECRET:-}"
    volumes:
      - mw_lab_data:/data
    depends_on:
      - mw-echo
    networks:
      - mw-net

  mw-mission:
    image: ghcr.io/a-l-l-a-h/mw-mission:${MW_IMAGE_TAG:-latest}
    container_name: mw-mission
    restart: unless-stopped
    profiles: ["ops", "full"]
    ports:
      - "${MW_MISSION_PORT:-4410}:4410"
    environment:
      PORT: "4410"
      MW_ECHO_URL: "http://mw-echo:4310"
      MW_API_SECRET: "${MW_API_SECRET:-}"
    volumes:
      - mw_mission_data:/data
    depends_on:
      - mw-echo
    networks:
      - mw-net

  mw-cp:
    image: ghcr.io/a-l-l-a-h/mw-cp:${MW_IMAGE_TAG:-latest}
    container_name: mw-cp
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["ops", "business", "full"]
    ports:
      - "${MW_CP_PORT:-4440}:4440"
    environment:
      PORT: "4440"
      MW_ECHO_URL: "http://mw-echo:4310"
      MW_RID_URL: "http://mw-rid:4480"
      MW_RID_ISSUER: "https://id.${MW_DOMAIN:-mw.local}"
      MW_RID_JWKS_URL: "http://mw-rid:4480/jwks"
      MW_API_SECRET: "${MW_API_SECRET:-}"
      MW_JWT_SECRET: "${MW_JWT_SECRET:-}"
    volumes:
      - mw_cp_data:/data
    depends_on:
      - mw-echo
    networks:
      - mw-net

  # ---------------------------------------------------------------------------
  # SAAS / FULL — Postgres + Dock + Design + Board
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mw-postgres
    restart: unless-stopped
    mem_limit: 384m
    profiles: ["saas", "business", "full"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-moonwitness}"
      POSTGRES_USER: "${POSTGRES_USER:-moonwitness}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-moonwitness}"
    volumes:
      - mw_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moonwitness} -d ${POSTGRES_DB:-moonwitness}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mw-net

  mw-dock:
    image: ghcr.io/a-l-l-a-h/mw-dock:${MW_IMAGE_TAG:-latest}
    container_name: mw-dock
    restart: unless-stopped
    profiles: ["saas", "full"]
    ports:
      - "${MW_DOCK_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-moonwitness}:${POSTGRES_PASSWORD:-moonwitness}@postgres:5432/${POSTGRES_DB:-moonwitness}"
      MW_ECHO_URL: "http://mw-echo:4310"
      MW_MISSION_URL: "http://mw-mission:4410"
      MW_RID_URL: "http://mw-rid:4480"
      MW_RID_ISSUER: "https://id.${MW_DOMAIN:-mw.local}"
      MW_RID_JWKS_URL: "http://mw-rid:4480/jwks"
      MW_JWT_SECRET: "${MW_JWT_SECRET:-}"
    volumes:
      - mw_dock_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mw-net

  mw-design:
    image: ghcr.io/a-l-l-a-h/mw-design:${MW_IMAGE_TAG:-latest}
    container_name: mw-design
    restart: unless-stopped
    profiles: ["saas", "full"]
    ports:
      - "${MW_DESIGN_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-moonwitness}:${POSTGRES_PASSWORD:-moonwitness}@postgres:5432/${POSTGRES_DB:-moonwitness}"
      MW_JWT_SECRET: "${MW_JWT_SECRET:-}"
    volumes:
      - mw_design_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mw-net

  mw-board:
    image: ghcr.io/a-l-l-a-h/mw-xv:${MW_IMAGE_TAG:-latest}
    container_name: mw-board
    restart: unless-stopped
    mem_limit: 512m
    profiles: ["saas", "business", "full"]
    ports:
      - "${MW_BOARD_PORT:-3001}:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-moonwitness}:${POSTGRES_PASSWORD:-moonwitness}@postgres:5432/${POSTGRES_DB:-moonwitness}"
      MW_JWT_SECRET: "${MW_JWT_SECRET:-}"
      MW_TEMPLATES_DIR: "${MW_TEMPLATES_DIR:-/opt/mw-templates}"
      QDRANT_URL: "${QDRANT_URL:-}"
      TURSO_DATABASE_URL: "${TURSO_DATABASE_URL:-}"
    volumes:
      - mw_board_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mw-net

  # ---------------------------------------------------------------------------
  # ISP / FULL — Sovereign ISP & RADIUS
  # ---------------------------------------------------------------------------
  mw-isp:
    image: ghcr.io/a-l-l-a-h/mw-isp:${MW_IMAGE_TAG:-latest}
    container_name: mw-isp
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["isp", "business", "full"]
    ports:
      - "${MW_ISP_PORT:-8091}:8091"
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "3799:3799/udp"
    environment:
      PORT: "8091"
      MW_API_SECRET: "${MW_API_SECRET:-}"
      MW_JWT_SECRET: "${MW_JWT_SECRET:-}"
    volumes:
      - mw_isp_data:/data
    networks:
      - mw-net

  # ---------------------------------------------------------------------------
  # EPISTEMIC / FULL — Corpus + Nexus + Lore
  # ---------------------------------------------------------------------------
  mw-corpus:
    image: ghcr.io/a-l-l-a-h/mw-corpus:${MW_IMAGE_TAG:-latest}
    container_name: mw-corpus
    restart: unless-stopped
    profiles: ["epistemic", "full"]
    ports:
      - "${MW_CORPUS_PORT:-4420}:4420"
    environment:
      PORT: "4420"
      MW_API_SECRET: "${MW_API_SECRET:-}"
    volumes:
      - mw_corpus_data:/data
    networks:
      - mw-net

  mw-nexus:
    image: ghcr.io/a-l-l-a-h/mw-nexus:${MW_IMAGE_TAG:-latest}
    container_name: mw-nexus
    restart: unless-stopped
    profiles: ["epistemic", "full"]
    ports:
      - "${MW_NEXUS_PORT:-4430}:4430"
    environment:
      PORT: "4430"
      MW_CORPUS_URL: "http://mw-corpus:4420"
      MW_API_SECRET: "${MW_API_SECRET:-}"
    volumes:
      - mw_nexus_data:/data
    networks:
      - mw-net

  mw-lore:
    image: ghcr.io/a-l-l-a-h/mw-lore:${MW_IMAGE_TAG:-latest}
    container_name: mw-lore
    restart: unless-stopped
    profiles: ["epistemic", "full"]
    ports:
      - "${MW_LORE_PORT:-4450}:4450"
    environment:
      PORT: "4450"
      MW_CORPUS_URL: "http://mw-corpus:4420"
      MW_NEXUS_URL: "http://mw-nexus:4430"
      MW_API_SECRET: "${MW_API_SECRET:-}"
    volumes:
      - mw_lore_data:/data
    networks:
      - mw-net

  # ---------------------------------------------------------------------------
  # PORTAL / FULL — Flagship Public Web Portal (A-L-L-A-H.COM)
  # ---------------------------------------------------------------------------
  mw-mylove:
    image: ghcr.io/a-l-l-a-h/mw-mylove:${MW_IMAGE_TAG:-latest}
    container_name: mw-mylove
    restart: unless-stopped
    profiles: ["portal", "full"]
    ports:
      - "${MW_MYLOVE_PORT:-4460}:4460"
    environment:
      MW_MYLOVE_PORT: "4460"
      MW_CORPUS_URL: "http://mw-corpus:4420"
      MW_NEXUS_URL: "http://mw-nexus:4430"
      MW_LORE_URL: "http://mw-lore:4450"
      MW_ECHO_URL: "http://mw-echo:4310"
      MW_RID_URL: "http://mw-rid:4480"
      MW_RID_ISSUER: "https://id.${MW_DOMAIN:-mw.local}"
      MW_RID_JWKS_URL: "http://mw-rid:4480/jwks"
    networks:
      - mw-net

  # ---------------------------------------------------------------------------
  # STUDIO / FULL — Sovereign Studio & Mission Workspace
  # ---------------------------------------------------------------------------
  mw-studio:
    image: ghcr.io/a-l-l-a-h/mw-studio:${MW_IMAGE_TAG:-latest}
    container_name: mw-studio
    restart: unless-stopped
    profiles: ["studio", "full"]
    ports:
      - "${MW_STUDIO_PORT:-4470}:4470"
    environment:
      PORT: "4470"
      MW_MISSION_URL: "http://mw-mission:4410"
      MW_ECHO_URL: "http://mw-echo:4310"
      MW_API_SECRET: "${MW_API_SECRET:-}"
    networks:
      - mw-net

  # ---------------------------------------------------------------------------
  # ROCKSOUL / FULL — Rocksoul AI Gateway, Cognitive Core, MCP & Sandbox
  # ---------------------------------------------------------------------------
  mw-rocksoul-gateway:
    image: ghcr.io/a-l-l-a-h/mw-rocksoul-gateway:${MW_IMAGE_TAG:-latest}
    container_name: mw-rocksoul-gateway
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["rocksoul", "business", "full"]
    ports:
      - "${MW_ROCKSOUL_GATEWAY_PORT:-4510}:4510"
    environment:
      PORT: "4510"
      ROCKSOUL_GATEWAY_PORT: "4510"
      ROCKSOUL_DEFAULT_CLASSIFICATION: "${ROCKSOUL_DEFAULT_CLASSIFICATION:-cloud_eligible}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      MW_ECHO_URL: "http://mw-echo:4310"
      MW_RID_URL: "http://mw-rid:4480"
      MW_RID_ISSUER: "https://id.${MW_DOMAIN:-mw.local}"
      MW_RID_JWKS_URL: "http://mw-rid:4480/jwks"
      MW_API_SECRET: "${MW_API_SECRET:-}"
    volumes:
      - mw_rocksoul_gateway_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4510/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mw-net

  mw-rocksoul-core:
    image: ghcr.io/a-l-l-a-h/mw-rocksoul-core:${MW_IMAGE_TAG:-latest}
    container_name: mw-rocksoul-core
    restart: unless-stopped
    profiles: ["rocksoul", "full"]
    ports:
      - "${MW_ROCKSOUL_CORE_PORT:-4520}:4520"
    environment:
      PORT: "4520"
      ROCKSOUL_CORE_PORT: "4520"
      MW_ROCKSOUL_GATEWAY_URL: "http://mw-rocksoul-gateway:4510"
      MW_ROCKSOUL_MCP_URL: "http://mw-rocksoul-mcp:4530"
      MW_ROCKSOUL_SANDBOX_URL: "http://mw-rocksoul-sandbox:4540"
      MW_API_SECRET: "${MW_API_SECRET:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4520/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mw-net

  mw-rocksoul-mcp:
    image: ghcr.io/a-l-l-a-h/mw-rocksoul-mcp:${MW_IMAGE_TAG:-latest}
    container_name: mw-rocksoul-mcp
    restart: unless-stopped
    profiles: ["rocksoul", "full"]
    ports:
      - "${MW_ROCKSOUL_MCP_PORT:-4530}:4530"
    environment:
      PORT: "4530"
      ROCKSOUL_MCP_PORT: "4530"
      MW_ECHO_URL: "http://mw-echo:4310"
      MW_RID_URL: "http://mw-rid:4480"
      MW_XV_URL: "http://mw-board:3001"
      MW_CP_URL: "http://mw-cp:4440"
      MW_ISP_URL: "http://mw-isp:8091"
      MW_CORPUS_URL: "http://mw-corpus:4420"
      MW_API_SECRET: "${MW_API_SECRET:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4530/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mw-net

  mw-rocksoul-sandbox:
    image: ghcr.io/a-l-l-a-h/mw-rocksoul-sandbox:${MW_IMAGE_TAG:-latest}
    container_name: mw-rocksoul-sandbox
    restart: unless-stopped
    profiles: ["rocksoul", "full"]
    ports:
      - "${MW_ROCKSOUL_SANDBOX_PORT:-4540}:4540"
    environment:
      PORT: "4540"
      ROCKSOUL_SANDBOX_PORT: "4540"
      MW_ECHO_URL: "http://mw-echo:4310"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://mw-echo:4310/v1/traces"
      MW_API_SECRET: "${MW_API_SECRET:-}"
    volumes:
      - mw_rocksoul_sandbox_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4540/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mw-net

  # ---------------------------------------------------------------------------
  # TUNNEL / FULL — Cloudflare Zero-Trust Tunnel
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mw-cloudflared
    restart: unless-stopped
    profiles: ["tunnel", "full"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    networks:
      - mw-net

  # ---------------------------------------------------------------------------
  # PROXY / FULL — Caddy Automatic HTTPS Reverse Proxy
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: mw-caddy
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["proxy", "business", "full"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MW_DOMAIN: "${MW_DOMAIN:-mw.local}"
      MW_ACME_EMAIL: "${MW_ACME_EMAIL:-ops@mw.local}"
    volumes:
      - ./Caddyfile.template:/etc/caddy/Caddyfile:ro
      - mw_caddy_data:/data
      - mw_caddy_config:/config
    networks:
      - mw-net
