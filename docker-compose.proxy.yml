services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: mw-docker-socket-proxy
    restart: unless-stopped
    mem_limit: 64m
    profiles: ["ops", "business", "full"]
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "1"
      AUTH: "0"
      SECRETS: "0"
      SWARM: "0"
      NODES: "0"
      SERVICES: "0"
      TASKS: "0"
      EXEC: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mw-net

  mw-cp:
    environment:
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
    depends_on:
      docker-socket-proxy:
        condition: service_started
