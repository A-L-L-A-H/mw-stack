name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify catalog/scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check conventional commit messages
        if: github.event_name == 'pull_request'
        run: |
          git log --format=%s origin/main..HEAD | while IFS= read -r msg; do
            echo "$msg" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|build|ci|revert|security|deps|style|release)(\(.+\))?!?: .+' || { echo "Invalid: $msg"; exit 1; }
          done

      - name: Shell syntax
        run: |
          find . -maxdepth 2 -name '*.sh' -not -path './node_modules/*' -print0 | xargs -0 -r bash -n

      - name: Data validation
        run: |
          if [ -f scripts/verify-catalog.mjs ]; then node scripts/verify-catalog.mjs; fi
          if [ -f scripts/validate-compose-security.mjs ]; then node scripts/validate-compose-security.mjs; fi
          if [ -f registry/services.json ]; then node -e 'JSON.parse(require("fs").readFileSync("registry/services.json","utf8"))'; fi
          if [ -f workspace.json ]; then node -e 'JSON.parse(require("fs").readFileSync("workspace.json","utf8"))'; fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
